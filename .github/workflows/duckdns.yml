name: Update DuckDNS

on:
  schedule:
    
cron: "/5 * * *"
workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      
name: Update DuckDNS IP
      env:
        DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      run: |
        response=$(curl -fsS --get \--data-urlencode "domains=$DUCKDNS_DOMAIN" \--data-urlencode "token=$DUCKDNS_TOKEN" \--data-urlencode "verbose=true" \https://www.duckdns.org/update)

          echo "$response"

          if ! echo "$response" | grep -qx "OK"; then
            echo "DuckDNS update failed"
            exit 1
          fi
